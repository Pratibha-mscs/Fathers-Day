<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Dad — A Memory Box</title>
  <meta name="description" content="A secret memory box made by three children for their father." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Parisienne&family=Caveat:wght@400;500;600;700&family=Indie+Flower&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="storybook.css" />
</head>
<body>
  <!-- Striped scrapbook background + paper grain -->
  <div class="bg-stripes" aria-hidden="true"></div>
  <div class="bg-grain" aria-hidden="true"></div>
  <div class="bg-vignette" aria-hidden="true"></div>

  <!-- Falling petals layer -->
  <div class="petals" id="petals" aria-hidden="true"></div>

  <!-- Floating decorative scrapbook objects -->
  <div class="floaties" id="floaties" aria-hidden="true">
    <span class="floaty" data-depth="0.6" style="top:12%; left:8%;  font-size:1.9rem; animation-duration:13s;">⭐</span>
    <span class="floaty" data-depth="1.4" style="top:22%; left:84%; font-size:2.4rem; animation-duration:17s;">🦋</span>
    <span class="floaty" data-depth="0.9" style="top:68%; left:6%;  font-size:2.1rem; animation-duration:15s;">🌷</span>
    <span class="floaty" data-depth="1.2" style="top:78%; left:88%; font-size:2.3rem; animation-duration:19s;">🎀</span>
    <span class="floaty" data-depth="0.5" style="top:40%; left:3%;  font-size:1.6rem; animation-duration:21s;">☁️</span>
    <span class="floaty" data-depth="1.6" style="top:8%;  left:46%; font-size:1.7rem; animation-duration:14s;">✨</span>
    <span class="floaty" data-depth="0.8" style="top:85%; left:40%; font-size:2.0rem; animation-duration:18s;">🌼</span>
    <span class="floaty" data-depth="1.1" style="top:55%; left:92%; font-size:1.8rem; animation-duration:16s;">🎈</span>
    <span class="floaty" data-depth="0.7" style="top:30%; left:70%; font-size:1.6rem; animation-duration:20s;">📍</span>
    <span class="floaty" data-depth="1.3" style="top:62%; left:74%; font-size:1.9rem; animation-duration:15s;">🧸</span>
    <span class="floaty" data-depth="0.6" style="top:16%; left:26%; font-size:1.7rem; animation-duration:22s;">🎠</span>
    <span class="floaty" data-depth="1.5" style="top:90%; left:14%; font-size:1.7rem; animation-duration:17s;">💌</span>
    <span class="floaty" data-depth="0.9" style="top:48%; left:54%; font-size:1.5rem; animation-duration:23s;">🎟️</span>
    <span class="floaty" data-depth="1.0" style="top:6%;  left:66%; font-size:1.6rem; animation-duration:19s;">🌻</span>
  </div>

  <!-- ===================== LANDING SCENE ===================== -->
  <main class="desk" id="desk">

    <!-- Pinned hero postcard -->
    <section class="hero-postcard" data-depth="0.5">
      <span class="pin" aria-hidden="true"></span>
      <div class="hero-stamp" aria-hidden="true">
        <span>POST<br>CARD</span>
      </div>
      <p class="hero-line postmark">★ with all our love ★</p>
      <h1 class="hero-title">To the man who gave us<br>a thousand memories,</h1>
      <p class="hero-sub">we saved a few for you.</p>
      <p class="hero-cta">Open a letter ↓</p>
    </section>

    <!-- Three envelopes scattered on the desk -->
    <section class="envelopes" aria-label="Three letters waiting to be opened">

      <!-- Envelope 1 -->
      <button class="envelope env-1" data-sender="Anjalee" data-key="anjalee"
              style="--rot:-6deg;" aria-label="Open the letter: The Words I Never Said">
        <span class="tape tape-tl" aria-hidden="true"></span>
        <span class="env-stamp" aria-hidden="true">15c</span>
        <span class="env-postmark" aria-hidden="true">◷</span>
        <span class="wax-seal" aria-hidden="true">A</span>
        <span class="env-flap" aria-hidden="true"></span>
        <span class="env-body" aria-hidden="true"></span>
        <span class="env-address">
          <span class="addr-line">For Papa</span>
          <span class="addr-sub">💌 The Words I Never Said</span>
        </span>
      </button>

      <!-- Envelope 2 -->
      <button class="envelope env-2" data-sender="Pratibha" data-key="pratibha"
              style="--rot:4deg;" aria-label="Open the letter: Things I Learned From You">
        <span class="tape tape-tr" aria-hidden="true"></span>
        <span class="env-stamp" aria-hidden="true">15c</span>
        <span class="env-postmark" aria-hidden="true">◷</span>
        <span class="wax-seal" aria-hidden="true">P</span>
        <span class="env-flap" aria-hidden="true"></span>
        <span class="env-body" aria-hidden="true"></span>
        <span class="env-address">
          <span class="addr-line">For Papa</span>
          <span class="addr-sub">🌻 Things I Learned From You</span>
        </span>
      </button>

      <!-- Envelope 3 -->
      <button class="envelope env-3" data-sender="Bhaskar" data-key="bhaskar"
              style="--rot:-3deg;" aria-label="Open the letter: Memories I Didn't Want To Forget">
        <span class="tape tape-tl" aria-hidden="true"></span>
        <span class="env-stamp" aria-hidden="true">15c</span>
        <span class="env-postmark" aria-hidden="true">◷</span>
        <span class="wax-seal" aria-hidden="true">B</span>
        <span class="env-flap" aria-hidden="true"></span>
        <span class="env-body" aria-hidden="true"></span>
        <span class="env-address">
          <span class="addr-line">For Papa</span>
          <span class="addr-sub">📸 Memories I Didn't Want To Forget</span>
        </span>
      </button>

    </section>

    <!-- Hidden discoverable doodles scattered on the desk -->
    <div class="hidden-doodles" aria-hidden="true">
      <span class="doodle" style="top:14%; left:62%;" data-whisper="always behind the camera">📷</span>
      <span class="doodle" style="top:72%; left:30%;" data-whisper="our butterfly">🦋</span>
      <span class="doodle" style="top:58%; left:84%;" data-whisper="one more scoop?">🍦</span>
      <span class="doodle" style="top:26%; left:18%;" data-whisper="Manali, remember?">🏔️</span>
      <span class="doodle" style="top:84%; left:60%;" data-whisper="the rain we ran through">🌧️</span>
      <span class="doodle" style="top:20%; left:88%;" data-whisper="a little something">🎁</span>
    </div>
  </main>

  <!-- ===================== LETTER OVERLAY ===================== -->
  <div class="letter-overlay" id="letterOverlay" aria-hidden="true">
    <button class="letter-close" id="letterClose" aria-label="Close letter and go back to the desk">✕ tuck it back</button>

    <article class="letter-paper" id="letterPaper" role="dialog" aria-modal="true" aria-label="An open letter">
      <div class="letter-tape-top" aria-hidden="true"></div>
      <header class="letter-head">
        <p class="letter-eyebrow" id="letterEyebrow">💌 The Words I Never Said</p>
        <h2 class="letter-from" id="letterFrom">From Anjalee</h2>
        <p class="letter-date" id="letterDate">Father's Day, 2026</p>
      </header>
      <div class="letter-body" id="letterBody"></div>
      <footer class="letter-foot">
        <span class="letter-signoff" id="letterSignoff">— with all my love</span>
        <span class="letter-doodle" id="letterDoodle">🌻</span>
      </footer>
    </article>
  </div>

  <!-- A whisper that pops up when hovering hidden doodles -->
  <div class="whisper" id="whisper" aria-hidden="true"></div>

  <script src="storybook.js"></script>
  <script src="script.js"></script>
</body>
</html>
